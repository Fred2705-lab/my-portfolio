<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Works</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">
    
    <link rel="stylesheet" href="works.css"> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Faster+One&family=Orelega+One&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="logo">MY PORTFOLIO</div>
        <nav class="nav-links" id="navLinks"> 
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="works.html">Works</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="menu-toggle" id="menuToggle"> 
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <main id="works" class="content-main portfolio-section">
        <div class="two-column-layout">
            <div class="profile-card">
                <div class="profile-image-container">
                    <img src="mypic.jpg" alt="Fred Anthony Yanoc" class="profile-image">
                </div>
                <div class="contact-info">
                    <p>@fyanoc3.com</p>
                    <div class="social-icons">
                        <div class="icon-placeholder"><i class="fab fa-behance"></i></div>
                        <div class="icon-placeholder"><i class="fab fa-linkedin-in"></i></div>
                        <div class="icon-placeholder"><i class="fab fa-instagram"></i></div>
                        <div class="icon-placeholder"><i class="fab fa-twitter"></i></div>
                    </div>
                </div>
            </div>
            <div class="section-content">
                <h2>My Projects</h2>
                <div class="project-gallery">
                    
                    
                    <div class="project-item">
                        <h3>Personal Blog Site</h3>
                        <p>
                            Built with a simple HTML/CSS template. 
                            Features include a custom dark mode toggle and dynamic routing.
                        </p>
                        <a href="[Link to Project 3]" target="_blank">View Live Site</a>
                    </div>
                    
                </div>
            </div>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const menuToggle = document.getElementById('menuToggle');
        const nav = document.getElementById('navLinks');
        
        if (menuToggle && nav) {
            menuToggle.addEventListener('click', () => {
                nav.classList.toggle('active');
            });
        }
    });
    </script>
</body>
</html>
